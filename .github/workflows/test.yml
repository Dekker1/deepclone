name: Run Tests

on:
  push:
    branches:
      - "develop"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest channel is the `rust-version` declared in Cargo.toml, so that the
        # claim is checked rather than assumed.
        channel: ["stable", "1.85"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.channel }}
      - name: Run tests
        run: cargo test --workspace --all-features
      # Every doctest uses the derive and rustdoc has no per-doctest cfg, so this checks
      # that the library and integration tests build without it.
      - name: Run tests without default features
        run: cargo test --workspace --no-default-features --lib --tests
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain and clippy
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain and miri
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri
      # `-Zmiri-ignore-leaks` is required by the strong-`Rc`-cycle test, which builds a cycle
      # on purpose to assert that it panics; such a cycle leaks by construction.
      - name: Run miri
        run: cargo miri test --workspace --all-features
        env:
          MIRIFLAGS: "-Zmiri-ignore-leaks"
  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
